services:
  - type: web
    name: projector-adb-api
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: ohio
    healthCheckPath: /health
    envVars:
      # Chave do Tailscale (Settings > Keys > Generate auth key: Reusable + Ephemeral)
      - key: TS_AUTHKEY
        sync: false
      # Senha do painel: digitada uma vez no site quando ele pedir o token
      - key: API_TOKEN
        generateValue: true
      # Opcional: chave privada ADB em base64 (evita o aviso "Permitir depuração?" a cada deploy)
      - key: ADB_KEY_B64
        sync: false
      - key: PROJECTOR_TAILSCALE_IP
        value: 100.123.35.13
      - key: CORS_ORIGINS
        value: https://projecto.nevesalisson87.workers.dev
